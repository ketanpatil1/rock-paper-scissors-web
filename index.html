<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="./style.css">
    </head>

    <body>
        <header>
            <div class="spacer"></div>
            <h1>Rock, Paper & Scissors!</h1>
            <button class="help-btn">?</button>
        </header>

        <div class="score-area">
            <div class="player-card">
                <p>You</p>
                <div class="player-score score"></div>
            </div>
            <div class="cpu-card">
                <p>CPU</p>
                <div class="cpu-score score"></div>
            </div>
        </div>

        <div class="round-container">
            <div class="round-display">
                <div class="player-choice">
                    <p class="player-label">You</p>
                    <img class="player-choice-icon" src="./assets/default.svg" alt="No choice made yet">
                </div>
                <div class="cpu-choice">
                    <p class="cpu-label">CPU</p>
                    <img class="cpu-choice-icon" src="./assets/default.svg" alt="No choice made yet">
                </div>
            </div>
            <div class="round-result">New Game Started!</div>
        </div>

        <div class="options-container">
            <div id="rock" class="option">
                <img src="./assets/rock.svg" alt="rock">
            </div>
            <div id="paper" class="option">
                <img src="./assets/paper.svg" alt="paper">
            </div>
            <div id="scissors" class="option">
                <img src="./assets/scissors.svg" alt="scissors">
            </div>
        </div>

        <dialog>
            <button autofocus><img src="./assets/cross.svg" alt="close"></button>
            <section>
                <h2>Rules:</h2>
                <ul>
                    <li>Rock <img src="./assets/rock.svg" alt="rock"> beats Scissors <img src="./assets/scissors.svg" alt="scissors"></li>
                    <li>Paper <img src="./assets/paper.svg" alt="paper"> beats Rock <img src="./assets/rock.svg" alt="rock"></li>
                    <li>Scissors <img src="./assets/scissors.svg" alt="scissors"> beat Paper <img src="./assets/paper.svg" alt="paper"></li>
                </ul>
                <h2>Controls:</h2>
                <ul>
                    <li>Press <kbd>1</kbd> or <kbd>r</kbd> for Rock.</li>
                    <li>Press <kbd>2</kbd> or <kbd>p</kbd> for Paper.</li>
                    <li>Press <kbd>3</kbd> or <kbd>s</kbd> for Scissors.</li>
                </ul>
                <div>
                    <p>The first to win 5 rounds wins the match.</p>
                    <p>All The Best!</p>
                </div>
            </section>
        </dialog>

        <script src="game.js"></script>
    </body>
</html>
